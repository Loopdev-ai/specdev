name: deploy

# Fully-automatic delivery, dispatched per governed unit: merge -> staging ->
# staging QA gate -> auto-promote to prod -> prod QA. Staging post-deploy QA is
# the real promotion gate; if it fails, deploy-prod is skipped and rollback runs.
#
# This workflow only decides WHICH units a push touched; the chain itself lives
# in the reusable deploy-unit.yml. A single-root repo dispatches exactly one
# call with unit '.', which behaves as it did before multi-unit support.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/.specdev/traceability.md'   # avoid loop with the bot commit
      - '.specdev/traceability-index.md'

permissions:
  contents: write   # tag releases

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.m.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate the unit registry
        run: python .specdev/tools/units.py check
      - id: m
        name: Enumerate units touched by this push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A first push (or a force-push past the parent) has no usable base;
          # fall back to every unit rather than silently deploying nothing.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "units=$(python .specdev/tools/units.py matrix --all)" >> "$GITHUB_OUTPUT"
          else
            echo "units=$(python .specdev/tools/units.py matrix --changed-from "$BEFORE")" >> "$GITHUB_OUTPUT"
          fi

  # The `permissions:` block is REQUIRED, and its contents are dictated by
  # deploy-unit.yml, not by this file. A called reusable workflow may not
  # request a permission the calling job holds — including from a job-level
  # block INSIDE it — and GitHub validates that at workflow INITIALISATION,
  # before any `if:` or `needs:` is evaluated. deploy-unit.yml's `rollback` job
  # declares `issues: write` (it files the incident), which the workflow-level
  # `contents: write` above does not grant, so without this block the entire
  # deploy run ends as `startup_failure` with zero jobs and no logs — on every
  # merge to main, whether or not a rollback ever happens.
  #
  # tests/test_installed_layout.py checks every caller/callee pair for this;
  # if you add a permission to any job in deploy-unit.yml, it fails here until
  # this block matches.
  chain:
    needs: discover
    if: needs.discover.outputs.units != '[]'
    permissions:
      contents: write   # tag releases
      issues: write     # rollback files the incident
    strategy:
      fail-fast: false
      max-parallel: 1   # units deploy one at a time; each chain tags and pushes
      matrix:
        unit: ${{ fromJSON(needs.discover.outputs.units) }}
    uses: ./.github/workflows/deploy-unit.yml
    with:
      unit: ${{ matrix.unit }}
    secrets: inherit
