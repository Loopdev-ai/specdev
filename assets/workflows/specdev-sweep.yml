name: specdev-sweep

# Nightly unfiltered sweep across every governed unit.
#
# Required, not optional. org.json's `ref` may be a moving branch, so an
# upstream ADR can change with no local commit at all — invalidating recorded
# sha256 verifications in a repo that sees no PR activity for weeks. Every
# PR-triggered gate is blind to that: there is no PR to trigger them. Without
# this workflow a quiet repo looks green indefinitely while its verifications
# rot.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.m.outputs.units }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate the unit registry
        run: python .specdev/tools/units.py check
      - id: m
        name: Enumerate ALL units
        run: echo "units=$(python .specdev/tools/units.py matrix --all)" >> "$GITHUB_OUTPUT"

  sweep:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.discover.outputs.units) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Org ADR compliance — ${{ matrix.unit }}
        if: hashFiles(format('{0}/.specdev/org.json', matrix.unit)) != '' || hashFiles('.specdev/org.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNANCE_TOKEN: ${{ secrets.GOVERNANCE_TOKEN }}
        run: python .specdev/tools/check_org_adrs.py --unit '${{ matrix.unit }}'

  report:
    needs: [discover, sweep]
    if: always() && (needs.sweep.result == 'failure' || needs.discover.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          UNITS: ${{ needs.discover.outputs.units }}
        with:
          script: |
            const title = 'specdev-sweep: org ADR verifications are stale or failing';
            const body = [
              'The nightly SpecDev sweep failed.',
              '',
              'This usually means an org ADR changed upstream and one or more',
              "units' recorded `sha256` verifications are now stale. Re-run the",
              '`adr-checker` agent for the affected units to re-verify.',
              '',
              'Units swept: `' + (process.env.UNITS || '[]') + '`',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'specdev-sweep',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['specdev-sweep'],
              });
            }
