name: post-deploy-qa

# Reusable QA suite run against a live environment. Called by deploy.yml for
# both staging (the promotion gate) and prod (release verification). A failure
# here fails the calling job; for staging that skips prod promotion and trips
# rollback.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      target_url:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: string
      target_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke tests
        run: echo "TODO: smoke tests against ${{ inputs.target_url }} (${{ inputs.environment }})"

      - name: Critical-path E2E
        run: echo "TODO: e2e against ${{ inputs.target_url }}"   # e.g. npx playwright test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Synthetic / health check (uses profile health_path)
        run: python .specdev/tools/deploy.py health --url "${{ inputs.target_url }}"
