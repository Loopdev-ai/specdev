name: specdev-build

# Hands-off SpecDev build in CI, scoped to ONE governed unit. Started locally in
# Claude Code, handed off here:
#   - prod: merging the Spec PR (spec/** -> main) fires this; the runner builds
#     and PUSHES specdev/impl/<unit>/<FEAT> with a prepared PR body, then STOPS.
#     A HUMAN opens the PR from that branch and merges it (-> deploy.yml).
#   - poc:  pushing a poc/** branch fires this; the runner specs + builds,
#     pushes the same branch, and deploys the isolated poc env FROM it.
#
# THE BUILD NEVER OPENS OR MERGES A PULL REQUEST, in either mode. Doing so
# would require the repository setting "Allow GitHub Actions to create and
# approve pull requests" — one switch granting create AND approve, so enabling
# it lets Actions approve its way past the review this pipeline's merge gate
# depends on, and leaving it off made the old terminal state unreachable (a
# completed build with nowhere to put its result). A pushed branch needs only
# `contents: write`, is more directly attributable than a PR, and the PR a
# human then opens actually fires `on: pull_request` — a bot-authored one gets
# none of the required checks and cannot merge.
#
# The unit comes from the branch: spec/<unit>/<name> and poc/<unit>/<name>. A
# segment is read as a unit only when it names a REGISTERED unit, so a
# single-root repo's spec/<name> keeps working unchanged.
#
# Context stays bounded by the specdev skill's coordinator discipline. State is
# checkpointed to <unit>/.specdev/BUILD.md, which this workflow PUSHES to
# refs/heads/specdev/checkpoint/<unit>/<FEAT-###> in an always() step — on
# success, failure, timeout and circuit-break alike. That push is what makes a
# run resumable; the checkpoint file alone is not, because the runner's working
# tree is destroyed at job teardown. With ci.json `auto_resume` true (the
# default) a re-dispatch restores that ref before the agent starts.
#
# The build job is NOT green merely because the agent process exited. It ends
# with an assertion that the terminal state was actually reached — the
# implementation branch carries commits beyond the base, the PR body is
# prepared, and the checkpoint is no longer the stock template. deploy-poc is
# gated on that assertion, never on the exit code: a build that produced
# nothing must not trigger a deployment.
on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: ['poc/**']
  workflow_dispatch:
    inputs:
      feat:
        description: 'FEAT-### to build (resume/manual)'
        required: true
        type: string
      mode:
        description: 'prod or poc'
        required: true
        type: string
      unit:
        description: 'governed unit (default: resolved from the branch)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# Parallel across units, serialised within one. This replaces the previous
# one-build-per-repo invariant: unrelated projects in a monorepo no longer wait
# on each other. Keyed on the ref so two features in the same unit still queue.
concurrency:
  group: specdev-build-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      mode: ${{ steps.decide.outputs.mode }}
      feat: ${{ steps.decide.outputs.feat }}
      unit: ${{ steps.unit.outputs.unit }}
      runner: ${{ steps.cfg.outputs.runner }}
      timeout: ${{ steps.cfg.outputs.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - id: unit
        name: Resolve the governed unit from the branch
        env:
          REF: ${{ github.event.pull_request.head.ref || github.ref }}
          UNIT_INPUT: ${{ inputs.unit }}
        run: |
          if [ -n "$UNIT_INPUT" ]; then
            echo "unit=$UNIT_INPUT" >> "$GITHUB_OUTPUT"
          else
            python .specdev/tools/units.py resolve-ref --ref "$REF" \
              | grep '^unit=' >> "$GITHUB_OUTPUT"
          fi
      - id: decide
        name: Decide whether and how to run
        env:
          UNIT: ${{ steps.unit.outputs.unit }}
        run: |
          event="${{ github.event_name }}"
          run=false; mode=""; feat=""
          if [ "$event" = "workflow_dispatch" ]; then
            run=true; mode="${{ inputs.mode }}"; feat="${{ inputs.feat }}"
          elif [ "$event" = "push" ]; then
            run=true; mode="poc"
          elif [ "$event" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" = "true" ] && \
               [ "${{ startsWith(github.event.pull_request.head.ref, 'spec/') }}" = "true" ]; then
              run=true; mode="prod"
            fi
          fi
          if [ -z "$feat" ] && [ -f "${UNIT}/.specdev/spec.md" ]; then
            feat=$(grep -oE 'FEAT-[0-9]+' "${UNIT}/.specdev/spec.md" | head -1 || true)
          fi
          {
            echo "run=$run"
            echo "mode=$mode"
            echo "feat=$feat"
          } >> "$GITHUB_OUTPUT"
      - id: cfg
        name: Read ci.json (unit first, repo root as fallback)
        env:
          UNIT: ${{ steps.unit.outputs.unit }}
        run: |
          echo "runner=$(python .specdev/tools/run_manifest.py --root "$UNIT" ci --get runner --repo-root .)" >> "$GITHUB_OUTPUT"
          echo "timeout=$(python .specdev/tools/run_manifest.py --root "$UNIT" ci --get max_session_minutes --repo-root .)" >> "$GITHUB_OUTPUT"

  # A branch scoped to one unit may not change another. Without this the branch
  # name could lie about what the PR touches, and the unit's gates would verify
  # the wrong blast radius.
  scope:
    needs: setup
    if: needs.setup.outputs.run == 'true' && needs.setup.outputs.unit != '.'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # This pre-build check covers the INPUT branch. It cannot cover what the
      # agent is about to write — that is the post-build check in the build
      # job, which is the one that enforces the promise made to the agent in
      # its prompt. On workflow_dispatch there is no base in the event payload
      # and nothing has changed yet, so this step says so and defers, rather
      # than diffing against an empty base and reporting green having compared
      # nothing.
      - name: Changes must stay inside ${{ needs.setup.outputs.unit }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice title=Pre-build scope check::No base ref in this event" \
                 "(normal for workflow_dispatch and first pushes). The input branch" \
                 "is not diffable here; the post-build scope check in the build job" \
                 "enforces scope against the run's own start SHA."
            exit 0
          fi
          python .specdev/tools/units.py scope-check \
            --unit '${{ needs.setup.outputs.unit }}' --changed-from "$BASE"

  build:
    needs: [setup, scope]
    if: needs.setup.outputs.run == 'true' && !cancelled() && needs.scope.result != 'failure'
    runs-on: ${{ needs.setup.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.setup.outputs.timeout) }}
    # The `secrets` context is NOT available in `jobs.<id>.steps.if`. A guard
    # written as `if: secrets.ANTHROPIC_API_KEY != ''` does not error — it
    # evaluates to empty, so the step silently never runs. Surface the secret as
    # job-level env (where `secrets` IS available) and gate on `env` instead.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' && 'yes' || 'no' }}
      UNIT: ${{ needs.setup.outputs.unit }}
      FEAT: ${{ needs.setup.outputs.feat }}
      MODE: ${{ needs.setup.outputs.mode }}
      # NOT a dotfile: actions/upload-artifact's globber skips hidden files,
      # so `.specdev-breaker.json` never reached the artifact and
      # if-no-files-found: warn stayed silent because the other two paths
      # matched. Also kept under runner.temp with them, so the upload does
      # not span two roots.
      BREAKER_STATE: ${{ runner.temp }}/specdev-breaker-state.json
      # The continuation prompt. Deliberately short and identical for every
      # attempt: the checkpoint is the state, not this text.
      CONTINUE_PROMPT: |
        You are resuming a SpecDev build that STOPPED BEFORE ITS TERMINAL
        STATE. A previous attempt in this same job ended its turn early; the
        work it committed is in the tree and its ledger is in
        <unit>/.specdev/BUILD.md.

        Read that ledger first, then continue the dependency-wave loop from
        the last GREEN wave. Do not restart from zero and do not re-verify
        waves already recorded green.

        Follow the vendored specdev skill at .claude/skills/specdev, as a
        strict coordinator: dispatch component-builder / qa-verifier /
        adr-checker / spec-explorer subagents, keep only their summaries.

        Commit every wave as it goes green. The terminal state is: the
        implementation branch carries your commits beyond the base branch, and
        <unit>/.specdev/PR_BODY.md is filled in. Do NOT open, review or merge
        a pull request in either mode - a human opens it.

        If you cannot reach the terminal state, write what is done, what is
        outstanding and what blocked you into BUILD.md, COMMIT it, and stop.
    outputs:
      terminal_ok: ${{ steps.verify.outputs.ok }}
      checkpoint_ref: ${{ steps.checkpoint.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Fail fast and legibly: without the key claude-code-action fails deep in
      # the run with an opaque auth error.
      - name: Require ANTHROPIC_API_KEY
        if: env.HAS_ANTHROPIC_KEY != 'yes'
        run: |
          echo "::error title=Missing secret::specdev-build needs the ANTHROPIC_API_KEY repo or org secret."
          echo "Add it under Settings -> Secrets and variables -> Actions."
          exit 1
      # The run's own start SHA. Captured here rather than read from the event
      # payload because `pull_request.base.sha` and `event.before` are both
      # empty on workflow_dispatch — which silently turned the scope guard into
      # a no-op on exactly the path used to re-dispatch a build.
      # `at` is the provenance half of the same idea: the terminal-state check
      # must be able to tell a PR THIS run opened from one that already
      # existed. Without it any pre-existing PR mentioning the FEAT id — a
      # human's, merged weeks ago — satisfies the assertion, and a run that
      # produced nothing reports success.
      - id: start
        name: Capture the run's start SHA and instant
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      # Ref names come from the tool, not from string interpolation. The unit
      # of a single-root repo is `.`, and `refs/heads/specdev/checkpoint/./F-1`
      # is not a legal ref name — git rejects any path containing `/./`. Built
      # by hand, the checkpoint push therefore failed on every single-root
      # repo, into a `||` branch that only warns, so `auto_resume` had nothing
      # to restore and no run was ever really resumable.
      - id: refs
        name: Resolve the ref names for this unit + FEAT
        run: |
          python .specdev/tools/build_outcome.py refs \
            --unit "$UNIT" --feat "$FEAT" >> "$GITHUB_OUTPUT"
          python .specdev/tools/build_outcome.py refs \
            --unit "$UNIT" --feat "$FEAT" \
            | sed 's/^impl=/IMPL_REF=/; s/^checkpoint=/CHECKPOINT_REF=/' \
            >> "$GITHUB_ENV"
      - name: Record run manifest (mode signal for the deploy guard)
        run: |
          python .specdev/tools/run_manifest.py init \
            --feat "$FEAT" --mode "$MODE" --unit "$UNIT"
          git config user.name  "specdev-bot"
          git config user.email "specdev-bot@users.noreply.github.com"
      # F6 was dead config: `auto_resume` was declared in ci.json and read by
      # nothing. It now means what it says — restore the last pushed checkpoint
      # so a re-dispatch continues instead of restarting from zero.
      - id: resume
        name: Restore the last checkpoint (ci.json auto_resume)
        run: |
          AUTO=$(python .specdev/tools/run_manifest.py --root "$UNIT" ci --get auto_resume --repo-root .)
          REF="${CHECKPOINT_REF}"
          if [ "$AUTO" != "True" ] && [ "$AUTO" != "true" ]; then
            echo "auto_resume is $AUTO — starting from the branch as-is."; exit 0
          fi
          if git fetch origin "refs/heads/${REF}:refs/remotes/origin/${REF}" 2>/dev/null; then
            PREFIX=""; [ "$UNIT" != "." ] && PREFIX="${UNIT}/"
            # BUILD.md is the checkpoint body and is restored wholesale.
            git checkout "origin/${REF}" -- "${PREFIX}.specdev/BUILD.md" 2>/dev/null || true
            # run.json is NOT. Restoring it wholesale silently overrode THIS
            # dispatch's feat/mode with the previous attempt's, leaving
            # run.json's consumers (mode_of, the deploy guard) disagreeing with
            # needs.setup.outputs.*. `resume` carries only the fields a resume
            # should carry — today just started_at, the logical build's clock.
            git show "origin/${REF}:${PREFIX}.specdev/run.json" \
              > "${{ runner.temp }}/prev-run.json" 2>/dev/null || true
            if [ -s "${{ runner.temp }}/prev-run.json" ]; then
              python .specdev/tools/run_manifest.py --root "$UNIT" resume \
                --from "${{ runner.temp }}/prev-run.json"
            fi
            echo "::notice title=Resumed::Restored the checkpoint from ${REF}."
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No checkpoint at ${REF} — this is a fresh build."
          fi
      # The circuit breaker runs INSIDE the agent loop as a hook, because a
      # post-run check cannot refund a run that has already spent the money.
      #
      # Every limit is resolved in ONE call that fails loudly. The previous
      # shape — three `$(get ...)` substitutions inside an `echo` — could not
      # fail: a command substitution's nonzero exit does not trip `set -e`
      # because the compound command's status is echo's. A broken ci.json
      # therefore wrote empty values, the breaker fell back to library
      # constants the adopter never chose, and the run presented as configured.
      # `breaker-env` also writes the resolved limits AND the file each came
      # from into the step summary, so "armed with what?" is answerable from
      # the run page.
      - name: Arm the circuit breaker
        run: |
          set -euo pipefail
          python .specdev/tools/run_manifest.py --root "$UNIT" breaker-env \
            --repo-root . --summary-out "$GITHUB_STEP_SUMMARY" \
            > "${{ runner.temp }}/breaker.env"
          cat "${{ runner.temp }}/breaker.env" >> "$GITHUB_ENV"
          echo "SPECDEV_BREAKER_STATE=${BREAKER_STATE}" >> "$GITHUB_ENV"
          # Continuation budget (U17). Resolved the same way and just as
          # loudly — an unresolvable key fails this step rather than arming a
          # library constant.
          ATTEMPTS=$(python .specdev/tools/run_manifest.py --root "$UNIT" ci --get max_build_attempts --repo-root .)
          CAP=$(python .specdev/tools/run_manifest.py --root "$UNIT" ci --get continuation_cap_usd --repo-root .)
          echo "MAX_ATTEMPTS=${ATTEMPTS}" >> "$GITHUB_ENV"
          echo "CONTINUATION_CAP_USD=${CAP}" >> "$GITHUB_ENV"
          echo "- Continuation: up to \`${ATTEMPTS}\` attempts, start-gated at \`\$${CAP}\` (the cap bounds whether the NEXT attempt begins, not what it spends)." \
            >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_ENV only takes effect in LATER steps, so seed the state file
          # with the path exported inline here.
          SPECDEV_BREAKER_STATE="${BREAKER_STATE}" \
            python .specdev/tools/circuit_breaker.py init
          cat > "${{ runner.temp }}/breaker-settings.json" <<'JSON'
          {
            "hooks": {
              "PreToolUse": [
                { "matcher": "*", "hooks": [
                  { "type": "command",
                    "command": "python .specdev/tools/circuit_breaker.py" } ] }
              ],
              "PostToolUse": [
                { "matcher": "*", "hooks": [
                  { "type": "command",
                    "command": "python .specdev/tools/circuit_breaker.py" } ] }
              ]
            }
          }
          JSON
      - id: head0
        name: Record HEAD before the first attempt
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: agent1
        name: Run the SpecDev build (headless Claude Code)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are the SpecDev build COORDINATOR running headlessly in CI.
            Follow the vendored specdev skill at .claude/skills/specdev exactly,
            acting as a strict coordinator: never write component code inline —
            dispatch the component-builder / qa-verifier / adr-checker /
            spec-explorer subagents (vendored in .claude/agents) and keep only
            their summaries.

            Feature: ${{ needs.setup.outputs.feat }}
            Mode:    ${{ needs.setup.outputs.mode }}
            Unit:    ${{ needs.setup.outputs.unit }}

            You are building ONE governed unit. Every .specdev/ artifact path in
            your work is relative to that unit root — <unit>/.specdev/spec.md,
            <unit>/.specdev/BUILD.md, <unit>/.specdev/run.json,
            <unit>/.specdev/adr/. The TOOLS always live at the repo root
            (.specdev/tools/) regardless of how many units exist. Pass the unit
            root to every tool that takes --root, and give it to the adr-checker
            subagent as its unit root.

            Never modify files outside your unit: a scope check fails the build
            if you do. Shared, unit-less files (top-level docs, CI config) are
            permitted but should be touched only when the feature genuinely
            requires it.

            Resume from <unit>/.specdev/BUILD.md; if the build is incomplete,
            continue the dependency-wave loop until the terminal state:
              - your commits are on the branch (COMMIT every wave - this job
                pushes them to specdev/impl/<unit>/<FEAT> for you), and
              - <unit>/.specdev/PR_BODY.md is filled in.
            Do NOT open, review or merge a pull request, in EITHER mode - a
            human opens it from that branch. `gh pr create`, `gh pr review` and
            `gh pr merge` are denied to you; that is deliberate, not an
            allowlist gap to report as a blocker.

            Reaching that terminal state is ASSERTED after you finish: the job
            fails unless the branch carries commits beyond the base and the PR
            body is prepared. Exiting cleanly without them is a failed build,
            not a partial success. Do NOT end your turn while a wave's QA is
            still outstanding or later waves are untouched — having turns to
            spare is not a reason to stop. If you genuinely cannot get there,
            write what is done, what is outstanding and what blocked you into
            <unit>/.specdev/BUILD.md, COMMIT it, and stop; an unexplained
            early exit is the one outcome this pipeline cannot recover from.

            Commit <unit>/.specdev/BUILD.md and <unit>/.specdev/run.json as
            each dependency wave goes green — not only at the end. This job
            pushes that checkpoint to specdev/checkpoint/<unit>/<FEAT> whatever
            happens, so anything you have committed survives a crash or a
            timeout and the next dispatch resumes from it. Anything you left
            uncommitted in your context does not.

            A circuit breaker is armed: if you accumulate too many permission
            denials, too many consecutive tool failures, or too much cost, the
            run is aborted. If a tool is denied, do NOT retry it in a loop —
            record the blocker in BUILD.md and stop, so the checkpoint is
            useful to the human who re-dispatches.
          # Explicit tool allowlist. Without one the agent runs with the FULL
          # default surface — including WebFetch/WebSearch — on a job that
          # writes code and, in poc mode, deploys an environment. An allowlist
          # makes the surface a reviewable decision instead of a default.
          #
          # ── REQUIRED FLOOR — do not tighten below this ──────────────────
          #   Task, Agent  subagent dispatch. `Task` was renamed `Agent`; both
          #                are listed so the list is right either way.
          #   Skill        the prompt's first instruction is to follow the
          #                vendored specdev skill.
          #   Read, Write, Edit, Glob, Grep, Bash
          #                the union of what .claude/agents/*.md declare.
          #                --allowedTools is a SESSION permission and subagents
          #                inherit it, so anything missing here is denied to
          #                every subagent whatever its own frontmatter grants.
          #
          # Cutting below that floor does not harden the job, it breaks it.
          # Containment comes from the scope check, the human PR gate (the
          # build opens no PR in any mode), the circuit breaker and the deny
          # list below — not from tool-prefix scarcity.
          #
          # `gh pr review` / `gh pr merge` / `gh pr create` are denied, and
          # unlike the rest of that list this is a boundary rather than a speed
          # bump. The list IS porous — broad Bash permits python3 -c, and no
          # interpreter can be denied — but that argument applies to
          # capabilities the build needs by another route. The coordinator has
          # no legitimate use for these three verbs in any mode: it stops at a
          # pushed branch, and `pull-requests: write` would otherwise let the
          # session approve a HUMAN's open PR, which is usually exactly what is
          # waiting for review. Bash stays broad
          # because the coordinator runs this repo's own test/lint/build
          # commands, which vary per stack; the deny list covers the egress and
          # credential paths, where the real risk is.
          claude_args: >-
            --max-turns 200
            --settings "${{ runner.temp }}/breaker-settings.json"
            --allowedTools "Task,Agent,Skill,Read,Write,Edit,Glob,Grep,Bash,TodoWrite"
            --disallowedTools "WebFetch,WebSearch,Bash(curl:*),Bash(wget:*),Bash(ssh:*),Bash(scp:*),Bash(aws:*),Bash(az:*),Bash(gcloud:*),Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr create:*)"

      # ── BOUNDED CONTINUATION (U17) ──────────────────────────────────────
      #
      # A coordinator that ends its turn ends the run. One did, at turn 35 of
      # 200, with wave 1 built, its QA still in flight and waves 2-6 untouched
      # — no error, no breaker trip, no turn exhaustion. Sharpening the prompt
      # did NOT fix it: the next run stopped after 6 turns and under four
      # minutes with the corrected wording in place. What built the feature was
      # a second invocation. A fix that depends on the model complying is not a
      # fix, so this is mechanical.
      #
      # It is additional STEPS IN THIS JOB, never a self-dispatch: GitHub does
      # not create workflow runs from events authored by the default token, so
      # a workflow calling `gh workflow run` on itself is a silent no-op. (Same
      # rule as bot-authored PRs not firing `on: pull_request` — see the README
      # section "Two things GitHub will not do for a bot".)
      #
      # Every gate condition must hold: terminal state unreached, attempts
      # left, spend under the cap, AND the previous attempt actually committed
      # something. That last one is what makes the loop safe — an attempt that
      # achieved nothing does not buy another. Cost comes from the ACTION's
      # own output, never the breaker's (which reads "unavailable" on hosted
      # runners by design); unreadable stops the loop rather than continuing
      # unbudgeted.
      - id: gate1
        name: Decide whether to continue (attempt 1)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .specdev/tools/build_outcome.py --root "$UNIT" continue-gate \
            --feat "$FEAT" --mode "$MODE" --unit "$UNIT" \
            --base "${{ github.event.repository.default_branch }}" \
            --repo-dir . --attempt 1 --max-attempts "$MAX_ATTEMPTS" \
            --spent "${{ steps.agent1.outputs.total_cost_usd }}" \
            --cap "$CONTINUATION_CAP_USD" \
            --head-before "${{ steps.head0.outputs.sha }}" \
            --head-now "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: head1
        name: Record HEAD before attempt 2
        if: always() && steps.gate1.outputs.go == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: agent2
        name: Continue the SpecDev build (attempt 2)
        if: always() && steps.gate1.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.CONTINUE_PROMPT }}
          claude_args: >-
            --max-turns 200
            --settings "${{ runner.temp }}/breaker-settings.json"
            --allowedTools "Task,Agent,Skill,Read,Write,Edit,Glob,Grep,Bash,TodoWrite"
            --disallowedTools "WebFetch,WebSearch,Bash(curl:*),Bash(wget:*),Bash(ssh:*),Bash(scp:*),Bash(aws:*),Bash(az:*),Bash(gcloud:*),Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr create:*)"
      - id: gate2
        name: Decide whether to continue (attempt 2)
        if: always() && steps.gate1.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .specdev/tools/build_outcome.py --root "$UNIT" continue-gate \
            --feat "$FEAT" --mode "$MODE" --unit "$UNIT" \
            --base "${{ github.event.repository.default_branch }}" \
            --repo-dir . --attempt 2 --max-attempts "$MAX_ATTEMPTS" \
            --spent "${{ steps.agent2.outputs.total_cost_usd }}" \
            --cap "$CONTINUATION_CAP_USD" \
            --head-before "${{ steps.head1.outputs.sha }}" \
            --head-now "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: agent3
        name: Continue the SpecDev build (attempt 3)
        if: always() && steps.gate2.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.CONTINUE_PROMPT }}
          claude_args: >-
            --max-turns 200
            --settings "${{ runner.temp }}/breaker-settings.json"
            --allowedTools "Task,Agent,Skill,Read,Write,Edit,Glob,Grep,Bash,TodoWrite"
            --disallowedTools "WebFetch,WebSearch,Bash(curl:*),Bash(wget:*),Bash(ssh:*),Bash(scp:*),Bash(aws:*),Bash(az:*),Bash(gcloud:*),Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr create:*)"

      # ── Everything below runs on success, failure, timeout and circuit-break
      # alike. The failing run is precisely the one whose checkpoint and denial
      # histogram are worth having.

      # F5: without this the checkpoint lives only in the runner's working tree
      # and dies at job teardown, so "resume" was never possible and a $39
      # run was unrecoverable. Pushed to a dedicated ref — never to a release
      # branch — so a broken build can never reach one.
      # THE DELIVERABLE. Pushed BEFORE the checkpoint commit exists, and that
      # ordering is load-bearing: the checkpoint commit carries [skip ci], and
      # GitHub skips EVERY workflow on a pull request whose head carries that
      # marker — no error, no skipped-run entry, just a PR with zero checks
      # that looks like CI has not started. If this ran after the checkpoint
      # step, the branch a human opens the PR from would have a [skip ci] head.
      #
      # Mechanical on purpose: the terminal state must not depend on the agent
      # choosing to push, any more than it should depend on it choosing to
      # stop. `contents: write` is all this needs — no create-PR capability.
      - id: impl
        name: Push the implementation branch
        if: always()
        run: |
          echo "ref=${IMPL_REF}" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet HEAD >/dev/null; then
            if git push --force origin "HEAD:refs/heads/${IMPL_REF}"; then
              echo "::notice title=Implementation branch pushed::${IMPL_REF} —" \
                   "open the PR from it; the body is in ${UNIT}/.specdev/PR_BODY.md."
            else
              echo "::warning title=Push failed::Could not push ${IMPL_REF}."
            fi
          fi

      - id: checkpoint
        name: Push the checkpoint
        if: always()
        run: |
          REF="${CHECKPOINT_REF}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          PREFIX=""; [ "$UNIT" != "." ] && PREFIX="${UNIT}/"
          git add -A -- "${PREFIX}.specdev/" || true
          if git diff --cached --quiet; then
            echo "::warning title=No checkpoint::The agent wrote no changes under ${PREFIX}.specdev/."
          else
            git commit -m "chore(specdev): checkpoint ${FEAT} on ${UNIT} [skip ci]" || true
          fi
          if git push --force origin "HEAD:refs/heads/${REF}"; then
            echo "::notice title=Checkpoint pushed::${REF}"
          else
            echo "::warning title=Checkpoint push failed::Could not push ${REF}."
          fi

      # F14: the promise made to the agent in its prompt — "a scope check fails
      # the build if you do" — was false, because the only scope job ran BEFORE
      # the agent and was never re-run against what it wrote. This is the step
      # that makes that sentence true.
      - name: Post-build scope check
        if: always() && needs.setup.outputs.unit != '.'
        run: |
          python .specdev/tools/units.py scope-check \
            --unit "$UNIT" --changed-from "${{ steps.start.outputs.sha }}"

      - name: Circuit breaker verdict
        if: always()
        run: python .specdev/tools/circuit_breaker.py verdict

      # F13: the job's exit code says the agent process ended, not that it
      # built anything. deploy-poc used to be gated on that exit code, so a
      # build that produced nothing still triggered a deployment.
      #
      # --since/--author are what make this an assertion about THIS RUN rather
      # than a text search. Gated on them, a human's PR that discusses the
      # feature, or one merged weeks ago, can no longer stand in for output
      # this build never produced. PR_AUTHORS is the identity the agent's
      # github_token resolves to; change it here (not in the tool) if you run
      # the build under a different app.
      #
      # --since is the LOGICAL build's start, from run.json (carried across a
      # resume), NOT this job's. Those are the same instant on a first attempt
      # and diverge on every re-dispatch — and with `auto_resume` a re-dispatch
      # continues the same build, so anchoring to the job made a build that had
      # ALREADY opened its Implementation PR unable to ever verify: the PR only
      # gets older, so each dispatch rejects it for predating the job, forever.
      # In poc that was worse than a false red — deploy-poc is gated on
      # terminal_ok, so a poc build whose PR was already merged could never
      # deploy, silently, with "no Implementation PR was found" as the reason.
      #
      # The window therefore widens to the earliest attempt at this unit+FEAT.
      # That is deliberate and is not capped: the checkpoint ref is per
      # unit+FEAT, so everything inside the window belongs to this same logical
      # build, and --author still excludes anyone else's work. The record says
      # which anchor was used so a reader never has to guess.
      # In `poc` mode, build_outcome.py verify() also requires BUILD.md's
      # '## Findings' section to be filled in (see findings_problems() in
      # that module) — a spike's deliverable is what it taught you, not the
      # code, which is reverse-mapped and rebuilt rather than promoted. That
      # check lives in the tool, not here, because this step's `run:` only
      # dispatches to it and interprets the exit code; the verdict itself
      # (and the reason text below in `problems`) is assembled in Python.
      - id: verify
        name: Assert the mode's terminal state was reached
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHORS: 'github-actions[bot]'
          JOB_STARTED_AT: ${{ steps.start.outputs.at }}
        run: |
          SINCE=$(python .specdev/tools/run_manifest.py --root "$UNIT" started-at || true)
          if [ -n "$SINCE" ]; then
            echo "Provenance window anchored to the logical build start ($SINCE)."
          else
            SINCE="$JOB_STARTED_AT"
            echo "::warning title=No build clock::run.json carries no" \
                 "started_at, so provenance is anchored to THIS JOB ($SINCE)." \
                 "A PR opened by an earlier attempt at this feature will be" \
                 "rejected as predating the run."
          fi
          if python .specdev/tools/build_outcome.py --root "$UNIT" verify \
               --feat "$FEAT" --mode "$MODE" --unit "$UNIT" \
               --base "${{ github.event.repository.default_branch }}" \
               --repo "${{ github.repository }}" \
               --since "$SINCE" \
               --author "$PR_AUTHORS" \
               --json-out "${{ runner.temp }}/verify.json"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # A failed run must leave a record behind. Without this, which tools were
      # denied — the datum you need to fix an allowlist — is unrecoverable.
      - name: Build outcome record
        if: always()
        run: |
          python .specdev/tools/build_outcome.py --root "$UNIT" report \
            --feat "$FEAT" --mode "$MODE" \
            --verify-json "${{ runner.temp }}/verify.json" \
            --breaker-json "$BREAKER_STATE" \
            --checkpoint-ref "${{ steps.checkpoint.outputs.ref }}" \
            --out "${{ runner.temp }}/build-outcome.md" \
            --append-build-md
      - name: Upload the build outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specdev-build-outcome-${{ needs.setup.outputs.feat }}
          path: |
            ${{ runner.temp }}/build-outcome.md
            ${{ runner.temp }}/verify.json
            ${{ runner.temp }}/specdev-breaker-state.json
          if-no-files-found: error

  # poc only: deploy the isolated poc environment FROM THE BUILT BRANCH, by
  # CALLING the reusable workflow directly (no push event, no PAT). There is no
  # self-merge any more: poc used to require the create-and-approve switch AND
  # autonomous merging into main — the riskier half of the two modes. Deploying
  # from the branch removes both, and a poc environment is isolated by
  # definition, so nothing is lost.
  # Gated on the terminal-state ASSERTION, not on the build job's exit code.
  # `needs.build.result == 'success'` was satisfied by a run that produced no
  # branch, no commit and no PR — which would have deployed nothing, as
  # something.
  #
  # The `permissions:` block below is dictated by deploy-poc.yml, not by this
  # file. A called reusable workflow may not request a permission the calling
  # job does not hold, and GitHub validates that at workflow INITIALISATION —
  # before any `if:` is evaluated. So an under-granted call here does not skip
  # in prod mode: the whole run ends as `startup_failure`, zero jobs, no logs,
  # in EVERY mode.
  #
  # `id-token: write` is granted here because deploy-poc.yml carries a
  # "TODO: install/auth your platform CLI here" and OIDC login is the way most
  # adopters fill it — the first adopter to do so would otherwise break the
  # build workflow entirely, with a failure that names neither file. Granting
  # it up front costs nothing (the callee still bounds what it uses) and
  # removes the trap. It belongs on this job rather than at workflow level:
  # hoisting it would also hand an OIDC identity to the agentic build job,
  # which has no use for one.
  #
  # tests/test_installed_layout.py checks every caller/callee pair for this;
  # if you add a permission to any job in deploy-poc.yml, it fails here until
  # this block matches.
  deploy-poc:
    needs: [setup, build]
    if: needs.setup.outputs.mode == 'poc' && needs.build.outputs.terminal_ok == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/deploy-poc.yml
    with:
      environment: poc
      unit: ${{ needs.setup.outputs.unit }}
    secrets: inherit
