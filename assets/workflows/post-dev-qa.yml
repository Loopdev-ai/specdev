name: post-dev-qa

# Gate 2 — runs on the Implementation PR, per governed unit. With fully-automatic
# prod, these checks are most of what stands between a merge and production:
# keep them strict. Mark the **post-dev-qa summary** check — NOT the matrix
# legs — a required status check in branch protection; leg names are dynamic
# and cannot be required individually. Each gate's summary job carries a
# distinct `name:` so branch protection can tell them apart.
on:
  pull_request:
    branches: [main]
    # Spec-only PRs (Gate 1) carry no code/tests yet — don't run Gate 2 on them.
    # Unit-relative: a spec-only PR in any unit must be ignored, not just one
    # in a single-root repo.
    paths-ignore:
      - '**/.specdev/**'
  merge_group:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.m.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate the unit registry
        run: python .specdev/tools/units.py check
      - id: m
        name: Enumerate changed units
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: echo "units=$(python .specdev/tools/units.py matrix --changed-from "$BASE")" >> "$GITHUB_OUTPUT"

  qa:
    needs: discover
    if: needs.discover.outputs.units != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.discover.outputs.units) }}
    defaults:
      run:
        working-directory: ${{ matrix.unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- toolchain -------------------------------------------------------
      # TODO: set up your stack, e.g.
      #   - uses: actions/setup-node@v4   with: { node-version: '20' }
      #   - uses: actions/setup-python@v5 with: { python-version: '3.12' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # These four gates ship as STUBS THAT FAIL. An `echo "TODO"` would exit 0,
      # so a repo that never wires its stack has a QA gate reporting green while
      # verifying nothing — and with automatic prod, this gate is most of what
      # stands between a merge and production. A red gate on a fresh repo is the
      # correct state: replace each command below, then it goes green.
      - name: Lint — ${{ matrix.unit }}
        run: |
          echo "::error title=Unwired QA gate::Replace the Lint command in .github/workflows/post-dev-qa.yml"
          echo "e.g. npm run lint   |   ruff check .   |   golangci-lint run"
          exit 1

      - name: Unit + integration tests — ${{ matrix.unit }}
        run: |
          echo "::error title=Unwired QA gate::Replace the test command in .github/workflows/post-dev-qa.yml"
          echo "e.g. npm test -- --coverage   |   pytest --cov   |   go test ./..."
          exit 1

      # NOTE: line coverage is a floor, not a correctness proof — a high number
      # with weak assertions still passes. Prefer branch coverage, and treat the
      # traceability gap check below (every REQ has a test) as the real
      # requirement-coverage gate.
      - name: Coverage gate — ${{ matrix.unit }}
        run: |
          echo "::error title=Unwired QA gate::Replace the coverage threshold check in .github/workflows/post-dev-qa.yml"
          echo "Prefer BRANCH coverage; e.g. pytest --cov --cov-fail-under=80"
          exit 1

      # Repo-wide by nature: scoping a secret scan to one unit would be the
      # wrong trade, so this runs unfiltered on every matrix leg.
      #
      # The gitleaks BINARY is MIT-licensed and free. gitleaks/gitleaks-action@v2
      # requires a paid licence for GitHub organizations and FAILS CLOSED: it
      # errors with "missing gitleaks license" BEFORE scanning anything, so the
      # gate reports failure while having verified nothing. Running the binary
      # directly is free and actually scans.
      - name: Install gitleaks
        working-directory: .
        env:
          GITLEAKS_VERSION: '8.18.4'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Secret scan
        working-directory: .
        run: |
          set -euo pipefail
          # --redact keeps found secrets out of the public log.
          # Exit 1 = leaks found; the config allowlists test fixtures.
          if [ -f .gitleaks.toml ]; then
            gitleaks detect --source . --config .gitleaks.toml --redact --verbose
          else
            gitleaks detect --source . --redact --verbose
          fi

      - name: Dependency / SAST scan — ${{ matrix.unit }}
        run: |
          echo "::error title=Unwired QA gate::Replace the SAST/dependency audit in .github/workflows/post-dev-qa.yml"
          echo "e.g. npm audit --audit-level=high   |   pip-audit   |   govulncheck ./..."
          exit 1

      # Cumulative across the whole unit: checks spec.md + every archived
      # specs/*.md (+ product-requirements.md), so a regression that drops a
      # shipped feature's test fails here too, not just the current feature's.
      - name: Traceability — every requirement has a test — ${{ matrix.unit }}
        working-directory: .
        run: python .specdev/tools/gen_traceability.py --check-gaps --root '${{ matrix.unit }}'

  # The single required status check. Matrix leg names are dynamic, so branch
  # protection cannot require them individually.
  summary:
    name: post-dev-qa summary
    needs: [discover, qa]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Per-unit verdicts
        env:
          UNITS: ${{ needs.discover.outputs.units }}
          VERDICT: ${{ needs.qa.result }}
        run: |
          {
            echo "## post-dev-qa"
            echo ""
            echo "Changed units: \`${UNITS:-[]}\`"
            echo ""
            echo "Result: **${VERDICT}**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any unit failed
        if: needs.discover.result != 'success' || needs.qa.result == 'failure'
        run: |
          echo "One or more units failed post-dev-qa — open the matrix legs for detail."
          exit 1
