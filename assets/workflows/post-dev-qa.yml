name: post-dev-qa

# Gate 2 — runs on the Implementation PR. With fully-automatic prod, these
# checks are most of what stands between a merge and production: keep them
# strict. Mark every job below as a required status check in branch protection.
on:
  pull_request:
    branches: [main]
    # Spec-only PRs (Gate 1) carry no code/tests yet — don't run Gate 2 on them.
    paths-ignore:
      - '.specdev/**'

permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists PR commits via the API

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- toolchain -------------------------------------------------------
      # TODO: set up your stack, e.g.
      #   - uses: actions/setup-node@v4   with: { node-version: '20' }
      #   - uses: actions/setup-python@v5 with: { python-version: '3.12' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lint
        run: 'echo "TODO: project lint command"'            # e.g. npm run lint

      - name: Unit + integration tests
        run: 'echo "TODO: project test command"'            # e.g. npm test -- --coverage

      # NOTE: line coverage is a floor, not a correctness proof — a high number
      # with weak assertions still passes. Prefer branch coverage, and treat the
      # traceability gap check below (every REQ has a test) as the real
      # requirement-coverage gate.
      - name: Coverage gate
        run: 'echo "TODO: fail if branch coverage below threshold"' # e.g. enforce >= 80%

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency / SAST scan
        run: 'echo "TODO: SAST + dependency audit"'          # e.g. npm audit --audit-level=high

      # Cumulative across the whole product: checks spec.md + every archived
      # specs/*.md (+ product-requirements.md), so a regression that drops a
      # shipped feature's test fails here too, not just the current feature's.
      - name: Traceability — every requirement has a test
        run: python .specdev/tools/gen_traceability.py --check-gaps
